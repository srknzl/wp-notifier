services:
  wp-notifier:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Session and data directories
      SESSION_DATA_PATH: /app/.wwebjs_auth
      DATA_DIR: /app/data
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./data:/app/data
    # Shared memory size to prevent Chromium crashes
    shm_size: 1gb
